name: Mobile CI

on:
  pull_request:
    paths:
      - "inventory-app/**"
      - ".github/workflows/mobile-ci.yml"
  push:
    branches:
      - product-hardening
    paths:
      - "inventory-app/**"
      - ".github/workflows/mobile-ci.yml"

permissions:
  contents: write

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: inventory-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate package lock
        run: npm install --package-lock-only

      - name: Verify clean install
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Commit regenerated lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/product-hardening'
        working-directory: .
        run: |
          if git diff --quiet -- inventory-app/package-lock.json; then
            echo "package-lock.json is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inventory-app/package-lock.json
          git commit -m "chore: repair package lock"
          git push origin HEAD:product-hardening
