name: Mobile CI

on:
  pull_request:
    paths:
      - "inventory-app/**"
      - ".github/workflows/mobile-ci.yml"
  push:
    branches:
      - report-details-and-export
    paths:
      - "inventory-app/**"
      - ".github/workflows/mobile-ci.yml"

permissions:
  contents: write

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: inventory-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: inventory-app/package-lock.json

      - name: Refresh package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit refreshed package lock
        working-directory: .
        run: |
          if git diff --quiet -- inventory-app/package-lock.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inventory-app/package-lock.json
          git commit -m "deps: sync report export lockfile"
          git push origin HEAD:report-details-and-export

      - name: Install dependencies
        run: npm ci

      - name: Expo Doctor
        run: npx expo-doctor

      - name: Check Expo dependency versions
        run: npx expo install --check

      - name: TypeScript check
        run: npm run typecheck
